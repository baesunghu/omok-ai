<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAPS 오목</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#efe9dd;--ink:#22201b;--mut:#6f685b;--card:#fbf8f1;--wood:#d9b46c;--wood2:#c99f52;--line:#5b4423;--acc:#8a3b1f;--ok:#2d6a4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--ink:#ece6d8;--mut:#a59d8c;--card:#221f17;--wood:#b8924f;--wood2:#a5813f;--line:#3d2c12;--acc:#e08a5f;--ok:#6fbf92}}
:root[data-theme="dark"]{--bg:#17150f;--ink:#ece6d8;--mut:#a59d8c;--card:#221f17;--wood:#b8924f;--wood2:#a5813f;--line:#3d2c12;--acc:#e08a5f;--ok:#6fbf92}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px}
@media (max-width:820px){main{grid-template-columns:1fr}}
h1{font-family:"Gowun Batang",serif;font-size:34px;margin:0;letter-spacing:.02em}
.lede{color:var(--mut);margin:4px 0 16px;max-width:60ch}
#board{width:100%;aspect-ratio:1;border-radius:10px;display:block;touch-action:manipulation;cursor:pointer;
  box-shadow:0 1px 0 var(--wood2),0 10px 30px rgba(0,0,0,.18)}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:10px;padding:14px 16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#status{font-weight:600;min-height:1.5em}
.meter{height:6px;background:color-mix(in srgb,var(--mut) 25%,transparent);border-radius:3px;overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.small{font-size:13px;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
  <section>
    <h1>NAPS 오목</h1>
    <p class="lede">자가대국만으로 처음부터 학습한 11x11 오목 AI입니다. 신경망이 지금 이 브라우저 안에서 돌아갑니다.</p>
    <canvas id="board" aria-label="11x11 오목판"></canvas>
  </section>
  <section class="panel">
    <div class="card">
      <div id="status">모델을 불러오는 중…</div>
      <div class="meter"><span id="bar"></span></div>
      <div class="small" id="eval"></div>
    </div>
    <div class="card">
      <div class="label">내 돌</div>
      <div class="row" id="side">
        <button data-side="1" aria-pressed="true">흑 (먼저)</button>
        <button data-side="2" aria-pressed="false">백</button>
      </div>
    </div>
    <div class="card">
      <div class="label">난이도 (수마다 탐색 횟수)</div>
      <div class="row" id="level">
        <button data-sims="8" aria-pressed="false">쉬움</button>
        <button data-sims="48" aria-pressed="true">보통</button>
        <button data-sims="200" aria-pressed="false">어려움</button>
      </div>
    </div>
    <div class="row">
      <button id="new">새 게임</button>
      <button id="undo">한 수 무르기</button>
    </div>
    <p class="small">규칙: 가로·세로·대각선으로 다섯 개 이상 먼저 놓으면 승리. 모델은 NetV3 (128x8, 2.7M 파라미터).
      <a href="https://github.com/baesunghu/omok-ai">소스 코드</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
<script type="module">
import { loadModel, think, isWin } from "./app.js";
const N = 11, cv = document.getElementById("board"), st = document.getElementById("status"),
      bar = document.getElementById("bar"), evalEl = document.getElementById("eval");
let board = new Int8Array(N * N), turn = 1, human = 1, sims = 48, over = false, busy = false, history = [], ready = false;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  const d = devicePixelRatio || 1, S = cv.clientWidth * d; cv.width = cv.height = S;
  const x = cv.getContext("2d"), m = S / (N + 1);
  x.fillStyle = css("--wood"); x.fillRect(0, 0, S, S);
  x.strokeStyle = css("--line"); x.lineWidth = Math.max(1, d);
  for (let i = 1; i <= N; i++) {
    x.beginPath(); x.moveTo(m, i * m); x.lineTo(N * m, i * m); x.stroke();
    x.beginPath(); x.moveTo(i * m, m); x.lineTo(i * m, N * m); x.stroke();
  }
  x.fillStyle = css("--line");
  for (const [r, c] of [[2, 2], [2, 8], [5, 5], [8, 2], [8, 8]]) { x.beginPath(); x.arc((c + 1) * m, (r + 1) * m, m * .09, 0, 7); x.fill(); }
  history.forEach((cell, k) => {
    const r = (cell / N) | 0, c = cell % N, who = board[cell];
    x.beginPath(); x.arc((c + 1) * m, (r + 1) * m, m * .44, 0, 7);
    x.fillStyle = who === 1 ? "#141414" : "#f6f4ee"; x.fill(); x.strokeStyle = "#000"; x.lineWidth = d; x.stroke();
    if (k === history.length - 1) { x.beginPath(); x.arc((c + 1) * m, (r + 1) * m, m * .13, 0, 7); x.fillStyle = "#c8442a"; x.fill(); }
  });
}

function setStatus(t) { st.textContent = t; }
function place(cell) {
  board[cell] = turn; history.push(cell);
  if (isWin(board, cell, turn)) { over = true; setStatus(turn === human ? "이겼습니다! 🎉" : "AI가 이겼습니다."); }
  else if (!board.includes(0)) { over = true; setStatus("무승부입니다."); }
  turn = 3 - turn; draw();
}

async function aiMove() {
  if (over || turn === human) return;
  busy = true; setStatus("AI가 생각하는 중…");
  const r = await think(board, turn, sims, (a, b) => bar.style.width = (100 * a / b) + "%");
  bar.style.width = "100%";
  evalEl.textContent = `AI 판단: ${r.value >= 0 ? "AI" : "당신"} 쪽이 유리 (${Math.round(50 + 50 * Math.abs(r.value))}%)`;
  place(r.move); busy = false;
  if (!over) setStatus("당신 차례입니다.");
}

cv.addEventListener("click", e => {
  if (!ready || busy || over || turn !== human) return;
  const rect = cv.getBoundingClientRect(), m = rect.width / (N + 1);
  const c = Math.round((e.clientX - rect.left) / m) - 1, r = Math.round((e.clientY - rect.top) / m) - 1;
  if (r < 0 || r >= N || c < 0 || c >= N || board[r * N + c]) return;
  place(r * N + c); aiMove();
});

function newGame() {
  board = new Int8Array(N * N); turn = 1; over = false; history = []; bar.style.width = "0"; evalEl.textContent = "";
  draw(); if (ready) { setStatus(human === 1 ? "당신 차례입니다 (흑)." : ""); aiMove(); }
}
function pick(groupId, attr, fn) {
  document.querySelectorAll(`#${groupId} button`).forEach(b => b.addEventListener("click", () => {
    if (busy) return;
    document.querySelectorAll(`#${groupId} button`).forEach(o => o.setAttribute("aria-pressed", o === b));
    fn(+b.dataset[attr]);
  }));
}
pick("side", "side", v => { human = v; newGame(); });
pick("level", "sims", v => { sims = v; });
document.getElementById("new").onclick = () => { if (!busy) newGame(); };
document.getElementById("undo").onclick = () => {
  if (busy || history.length < 2) return;
  for (let k = 0; k < 2; k++) board[history.pop()] = 0;
  over = false; turn = human; draw(); setStatus("당신 차례입니다.");
};
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
loadModel("naps_v3.onnx").then(() => { ready = true; newGame(); })
  .catch(e => setStatus("모델을 불러오지 못했습니다: " + e.message));
</script>
</body>
</html>
